# cargo-deny: advisories, licenses, bans and sources for the Rust workspace.
# CI runs `cargo deny check`; see docs/security-tooling.md.

[graph]
all-features = true
# The platforms releases ship: macOS on Apple silicon, Linux on x64 and arm64 (server archives).
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]

[advisories]
# Every RustSec advisory fails, including unmaintained and unsound crates.
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
  # zbus 6 absorbed these crates; ksni 0.3.7, the Linux tray, still needs zbus 5. Notices that
  # they moved, not vulnerabilities.
  { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6, which ksni does not support yet" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6, which ksni does not support yet" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6, which ksni does not support yet" },
  # The window helper's Linux webview: wry needs webkit2gtk 2.0, whose GTK 3 bindings end at
  # gtk-rs 0.18. No release of either fixes these.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: build-time macro dependency of glib-macros 0.18 (GTK 3 bindings)" },
  { id = "RUSTSEC-2024-0429", reason = "glib 0.18: fixed in 0.20, which has no GTK 3 bindings; no crate in the helper (wry, webkit2gtk, tao, muda, gtk, ours) uses VariantStrIter" },
]

[licenses]
# Permissive licenses compatible with shipping an MIT application binary.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93
# The Linux tray: a public-domain dedication, more permissive than MIT.
# option-ext: file-level copyleft, reached only through wry's optional `dirs` (all-features);
# shipping it unmodified needs only its notice.
exceptions = [
  { crate = "ksni", allow = ["Unlicense"] },
  { crate = "option-ext", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# One TLS stack (rustls with ring): a second one must not arrive through a default feature.
deny = [
  { crate = "openssl-sys", reason = "rustls with ring is the only TLS stack" },
  { crate = "native-tls", reason = "rustls with ring is the only TLS stack" },
  { crate = "aws-lc-sys", reason = "rustls with ring is the only TLS stack" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
