title = "nonstopvibin secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "RFC 6455 public example nonce in the WebSocket handshake fixtures"
condition = "AND"
paths = ['''^tests/(integration|lazy-cores)\.test\.ts$''']
regexTarget = "line"
regexes = ['''"Sec-WebSocket-Key": "dGhlIHNhbXBsZSBub25jZQ=="''']
