name: Rust
# The Rust workspace's checks and packages. build.yml runs them beside the Electron checks in
# checks.yml; the switch to the Rust app moves these jobs into checks.yml, where `desktop` and
# `server` keep their required-check names (docs/decisions/rust-port.md, "Switching packaging").
# Until then the artifacts are named rust-* so release.yml, which publishes nonstopvibin-*,
# ignores them.
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      # The toolchain and components in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: checks
      - if: runner.os == 'Linux'
        name: Install WebKitGTK, GTK, Xvfb and D-Bus
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb dbus-daemon
      - run: bun ci --ignore-scripts
      - run: bun run registry:check
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - if: runner.os == 'macOS'
        run: cargo test --workspace --locked
      - if: runner.os == 'Linux'
        name: cargo test --workspace (display and session bus)
        run: xvfb-run -a dbus-run-session -- cargo test --workspace --locked
      - if: runner.os == 'Linux'
        name: Shell tests that drive a real window helper
        run: sh crates/shell/tests/gui.sh --locked
      - name: Generated TypeScript types match the Rust wire types
        run: |
          cargo test -p nsv-domain --locked
          git diff --exit-code -- tests/types/generated
          test -z "$(git status --porcelain -- tests/types/generated)"
      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-machete@0.10.1
      - if: runner.os == 'Linux'
        name: No unused dependencies
        run: cargo machete
  desktop:
    strategy:
      fail-fast: false
      matrix:
        # Host architecture only, as electron-builder built: macos-26 is arm64.
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    # Release builds read the signing secrets of the protected `release` environment.
    environment: ${{ inputs.release && 'release' || '' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: package
      - run: bun run setup
      - run: bun run build
      - if: runner.os == 'macOS'
        name: Package
        run: bun scripts/package-mac.ts
        env:
          # Developer ID signing and notarization in releases only, never pull requests.
          CSC_LINK: ${{ inputs.release && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.release && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ inputs.release && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.release && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.release && secrets.APPLE_TEAM_ID || '' }}
      - if: runner.os == 'Linux'
        name: Package
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev musl-tools
          rustup target add x86_64-unknown-linux-musl
          bun scripts/package-linux.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: ${{ !inputs.release && 7 || '' }}
          if-no-files-found: error
          name: rust-${{ runner.os }}
          # Installers and update feeds; release/mac-*/ holds the unpacked bundle.
          path: release/*.*
      - if: runner.os == 'macOS'
        name: Update an installed Electron build onto the Rust app
        # An ad-hoc Electron 0.0.1 build downloads the packaged zip through electron-updater
        # and Squirrel.Mac swaps the bundle; this is the hop every installed copy takes.
        timeout-minutes: 12
        run: bun run test:update:mac
      - if: runner.os == 'macOS'
        name: Update an installed Rust build in place
        # This checkout rebuilt as 0.0.1 refuses a forged bundle, then installs the packaged
        # zip from a local feed signed with a throwaway key and relaunches it.
        timeout-minutes: 25
        run: bun tests/mac-update-rust.mjs
      - if: runner.os == 'macOS' && (failure() || cancelled())
        name: Upload update test diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7
          if-no-files-found: ignore
          name: rust-diagnostics-${{ runner.os }}
          path: test-results/
  server:
    name: server (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        # Each architecture builds and smoke-tests natively: musl needs a C compiler per target.
        include:
          - { os: ubuntu-24.04, arch: x64, target: x86_64-unknown-linux-musl }
          - {
              os: ubuntu-24.04-arm,
              arch: arm64,
              target: aarch64-unknown-linux-musl,
            }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-
      - run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: server
      - run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - run: bun ci
      - run: bun run build
      - run: bun scripts/package-server.ts ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: ${{ !inputs.release && 7 || '' }}
          if-no-files-found: error
          name: rust-server-${{ matrix.arch }}
          path: release/*.tar.gz
      - name: Smoke-test the server archive
        run: bun run test:server
