name: Security checks
on:
  workflow_dispatch:
  # release.yml gates publishing on these jobs.
  workflow_call:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run security:install
      - run: bun run security:secrets
      - run: bun run security:history
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun ci --ignore-scripts
      - run: bun run security:deps
      - run: bun ci --ignore-scripts
        working-directory: .deepsec
      - run: bun run security:tooling
      # The Rust workspace: RustSec advisories, licences, bans and sources (deny.toml).
      - run: rustup toolchain install
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.0,cargo-audit@0.23.0
      - run: cargo deny --locked check
      - run: cargo audit
