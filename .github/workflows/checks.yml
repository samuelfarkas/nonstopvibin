name: Checks
# The desktop and server checks, written once. build.yml runs them on every change;
# release.yml runs the same steps with `release: true`, which keeps the artifacts for publishing.
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        # macos-26 is the arm64 image macos-latest pointed to when pinned.
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun run setup
      - run: bun run quality
      - run: bun run build
      - if: runner.os == 'macOS'
        name: Fetch the Electron binary
        # Fetched here with a limit; inside the smoke test a stalled download hangs the job.
        timeout-minutes: 5
        run: bun run install-electron
      - if: runner.os == 'macOS'
        name: Desktop smoke
        # Backstop above the smoke test's own limits.
        timeout-minutes: 6
        run: bun run test:desktop:built
      - if: runner.os == 'macOS'
        name: UI checks
        run: bun run test:ui:built
      - if: runner.os == 'Linux'
        name: Desktop smoke with Chromium sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libasound2t64 libgtk-3-0 libnss3
          bun run install-electron
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          xvfb-run -a bun run test:desktop:built
      - run: bun test
      # Installers for the host architecture, with the targets in package.json `build`.
      - name: Package
        run: bun run dist:built
      - if: runner.os == 'macOS'
        name: Update the packaged app in place
        # Backstop above the test's own limits.
        timeout-minutes: 10
        run: bun run test:update:mac
      - if: runner.os == 'macOS' && (failure() || cancelled())
        name: Upload desktop test diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7
          if-no-files-found: ignore
          name: desktop-diagnostics-${{ runner.os }}
          path: test-results/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Empty keeps the repository default for release artifacts.
          retention-days: ${{ !inputs.release && 7 || '' }}
          if-no-files-found: error
          name: nonstopvibin-${{ runner.os }}
          # Every top-level output file: installers, blockmaps and update feeds.
          path: |
            release/*.*
            !release/builder-*
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun ci
      - run: bun run dist:server
      - name: Smoke-test the x64 server archive
        run: bun run test:server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: ${{ !inputs.release && 7 || '' }}
          if-no-files-found: error
          name: nonstopvibin-server
          path: release/*.tar.gz
