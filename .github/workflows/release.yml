name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency: release-${{ github.ref }}
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun scripts/verify-release.mjs "$GITHUB_REF_NAME"
  security:
    needs: preflight
    uses: ./.github/workflows/security.yml
  build:
    needs: preflight
    uses: ./.github/workflows/checks.yml
    with:
      release: true
  release:
    needs: [build, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - run: bun scripts/verify-release.mjs "$GITHUB_REF_NAME" release
      - run: cd release && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - run: |
          channel=$(bun scripts/verify-release.mjs "$GITHUB_REF_NAME")
          case "$channel" in
            release) prerelease=() ;;
            prerelease) prerelease=(--prerelease) ;;
            *) exit 1 ;;
          esac
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "${prerelease[@]}" release/*
          gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
