name: Set up
description: >-
  Bun; for a build job also Bun's install cache, the toolchain in rust-toolchain.toml and a Rust
  build cache; on Linux, the apt `packages`. Every job checks out the repository first.
inputs:
  build:
    description: >-
      A build job's Rust cache key. Empty for the security and release jobs, which restore no
      cache.
    default: ""
  target:
    description: A Rust target to add to the toolchain.
    default: ""
  packages:
    description: Apt packages to install on Linux.
    default: ""
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
    - if: inputs.build != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-
    - if: inputs.build != ''
      shell: bash
      run: rustup toolchain install
    - if: inputs.target != ''
      shell: bash
      run: rustup target add "$TARGET"
      env:
        TARGET: ${{ inputs.target }}
    - if: inputs.build != ''
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ inputs.build }}
    - if: runner.os == 'Linux' && inputs.packages != ''
      shell: bash
      # Word splitting is the point: one argument per package.
      run: |
        sudo apt-get update
        sudo apt-get install -y $PACKAGES
      env:
        PACKAGES: ${{ inputs.packages }}
