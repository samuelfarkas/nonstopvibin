[package]
name = "nsv-core"
description = "CLIProxyAPI cores: binary pins, config, spawn, watchdog, ledger, restart policy, pool, management client and updates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
nsv-domain.workspace = true
nsv-net.workspace = true
nsv-store.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }

# The fake core is this test binary run as `cli-proxy-api --config <path>`, which libtest's
# argument parser would refuse; its main runs the tests itself.
[[test]]
name = "processes"
harness = false

[lints]
workspace = true
