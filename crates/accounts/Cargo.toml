[package]
name = "nsv-accounts"
description = "Accounts, quota, usage accounting, the deadline scheduler, sign-in, pricing and the model catalog."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
nsv-domain.workspace = true
nsv-store.workspace = true
nsv-net.workspace = true
nsv-core.workspace = true
getrandom = { workspace = true, features = ["std"] }
serde.workspace = true
# preserve_order: a queue entry without a request id is named by the hash of its JSON text, which
# keeps the order the core wrote its keys in, as JSON.parse and JSON.stringify did.
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }

[lints]
workspace = true
